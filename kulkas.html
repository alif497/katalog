<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kulkas LG | Katalog Electronic</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<header class="header"><a class="logo" href="index.html">KATALOG <span>ELECTRONIC</span></a></header>
<main class="container">
    <a class="backlink" href="index.html">‹ Kembali ke katalog</a>
    <article class="detailcard" data-id="3" data-name="Kulkas Dua Pintu LG" data-price="3850000" data-image="images/gambar-3.png">
        <img class="detailimage" src="gambar 3.png" alt="Kulkas dua pintu LG">
        <p class="productbrand">LG</p>
        <h1>Kulkas Dua Pintu</h1>
        <p class="productprice">Rp3.850.000</p>
        <p>Kulkas dua pintu untuk menyimpan makanan dan minuman. Kapasitas serta spesifikasi model perlu diperiksa kembali.</p>
        <label for="quantity">Jumlah produk</label>
        <input class="quantityinput" id="quantity" type="number" min="1" max="99" value="1">
        <button class="primarybutton addtocart">Tambah ke Keranjang</button>
    </article>
</main>
<script>document.querySelector(".addtocart").addEventListener("click", function () { addProduct(this); });</script>
</body>
