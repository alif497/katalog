<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microwave Sharp | Katalog Electronic</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<header class="header"><a class="logo" href="index.html">KATALOG <span>ELECTRONIC</span></a></header>
<main class="container">
    <a class="backlink" href="index.html">‹ Kembali ke katalog</a>
    <article class="detailcard" data-id="8" data-name="Sharp Microwave 23 Liter" data-price="1200000" data-image="images/gambar-8.png">
        <img class="detailimage" src="gambar 8.png" alt="Microwave Sharp 23 liter">
        <p class="productbrand">SHARP</p>
        <h1>Microwave 23 Liter</h1>
        <p class="productprice">Rp1.200.000</p>
        <p>Microwave Sharp berkapasitas 23 liter dengan pengaturan mekanis. Daya yang tercantum pada gambar adalah 450 W.</p>
        <label for="quantity">Jumlah produk</label>
        <input class="quantityinput" id="quantity" type="number" min="1" max="99" value="1">
        <button class="primarybutton addtocart">Tambah ke Keranjang</button>
    </article>
</main>
<script>document.querySelector(".addtocart").addEventListener("click", function () { addProduct(this); });</script>
</body>
</html>
