<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Daikin | Katalog Electronic</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<header class="header"><a class="logo" href="index.html">KATALOG <span>ELECTRONIC</span></a></header>
<main class="container">
    <a class="backlink" href="index.html">‹ Kembali ke katalog</a>
    <article class="detailcard" data-id="6" data-name="Daikin Breeze AC 0.5 PK" data-price="3900000" data-image="images/gambar-6.png">
        <img class="detailimage" src="gambar 6.png" alt="AC Daikin Breeze 0.5 PK">
        <p class="productbrand">DAIKIN</p>
        <h1>AC Breeze 0.5 PK</h1>
        <p class="productprice">Rp3.900.000</p>
        <p>AC Daikin Breeze dengan kapasitas 0.5 PK. Model yang tercantum pada gambar adalah FTP15AV14.</p>
        <label for="quantity">Jumlah produk</label>
        <input class="quantityinput" id="quantity" type="number" min="1" max="99" value="1">
        <button class="primarybutton addtocart">Tambah ke Keranjang</button>
    </article>
</main>
<script>document.querySelector(".addtocart").addEventListener("click", function () { addProduct(this); });</script>
</body>
</html>
